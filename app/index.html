:root{--y:#FFCC14;--ink:#1A2126;--red:#D6342A;--cream:#FFF8E1;--paper:#F3F3F1;--muted:#6B7177;--line:#E3E3E0;--green:#2E7D32}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--paper);color:var(--ink);line-height:1.8;-webkit-font-smoothing:antialiased}
.bar{background:var(--ink);color:var(--y);font-weight:800;font-size:13px;text-align:center;padding:7px 12px}
header{background:var(--y);padding:18px 16px 14px}
.wrap{max-width:760px;margin:0 auto}
header h1{font-size:26px;font-weight:900;line-height:1.35}
header .sub{font-weight:600;font-size:14px;margin-top:2px}
.checker{height:10px;width:110px;margin-top:12px;background-color:#fff;
  background-image:linear-gradient(45deg,var(--red) 25%,transparent 25%,transparent 75%,var(--red) 75%),linear-gradient(45deg,var(--red) 25%,transparent 25%,transparent 75%,var(--red) 75%);
  background-size:10px 10px;background-position:0 0,5px 5px}
nav.dates{display:flex;align-items:center;gap:8px;margin-top:14px}
nav.dates button{font-family:inherit;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:800;border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
nav.dates button:disabled{opacity:.35;cursor:default}
nav.dates .today{background:var(--ink);color:var(--y)}
nav.dates .label{flex:1;text-align:center;font-weight:900;font-size:17px}
.daynum{display:inline-block;background:var(--ink);color:var(--y);font-weight:800;font-size:12px;border-radius:20px;padding:1px 10px;margin-inline-start:6px;vertical-align:middle}
main{padding:14px 12px 40px}
.notice{background:var(--cream);border-right:6px solid var(--y);padding:10px 14px;border-radius:6px;font-size:14px;margin-bottom:12px}
.check{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:14px;box-shadow:0 1px 0 var(--line)}
.check h3{font-size:14px;font-weight:900;margin-bottom:6px}
.check label{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600;padding:5px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.check .time{margin-inline-start:auto;color:var(--muted);font-weight:500;font-size:13px}
.card{background:#fff;border-radius:10px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.card>.head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:6px solid var(--y)}
.card>.head h2{font-size:19px;font-weight:900;color:var(--red)}
.card>.head .tag{margin-inline-start:auto;font-size:12px;font-weight:800;background:var(--ink);color:var(--y);border-radius:6px;padding:2px 10px}
.card .body{padding:2px 14px 16px}
.reelgrid{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:start}
@media(max-width:480px){.reelgrid{grid-template-columns:96px 1fr}}
.reelgrid img{width:100%;border-radius:6px;border:2px solid var(--ink);display:block}
.k{font-size:12.5px;font-weight:800;color:var(--muted);margin-top:10px}
.hook{font-size:17px;font-weight:900;line-height:1.7}
ol.pts{padding-right:22px;list-style:persian;font-size:15px;font-weight:500}
ol.pts li{margin:3px 0}
.punch{background:var(--cream);border-right:5px solid var(--y);padding:6px 10px;border-radius:4px;font-weight:700;font-size:15px}
.cta{background:var(--ink);color:#fff;padding:7px 10px;border-radius:6px;font-weight:700;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chips span{background:var(--y);font-weight:800;font-size:13px;border-radius:4px;padding:1px 9px}
.narr{white-space:pre-wrap;background:var(--cream);border-right:5px solid var(--y);padding:12px 14px;border-radius:6px;font-size:16.5px;font-weight:700;line-height:2;margin-top:4px}
.cap{white-space:pre-wrap;background:var(--paper);border-radius:6px;padding:10px 12px;font-size:14px;margin-top:4px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{font-family:inherit;font-weight:800;font-size:13.5px;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn.dark{background:var(--ink);color:var(--y)}
.btn.ok{border-color:var(--green);color:var(--green)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px;scroll-snap-type:x mandatory}
.strip figure{flex:none;scroll-snap-align:start;width:min(62vw,260px)}
.strip.story figure{width:min(44vw,190px)}
.strip img{width:100%;display:block;border-radius:6px;border:1px solid var(--line)}
figcaption{font-size:12.5px;font-weight:600;margin-top:4px;line-height:1.6}
figcaption b{display:block;font-weight:900;font-size:13.5px}
figcaption .btn{margin-top:6px;padding:3px 10px;font-size:12px}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.cal button{font-family:inherit;text-align:right;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:12px;line-height:1.5;color:var(--ink)}
.cal button b{display:block;font-size:13px}
.cal button.cur{border:2px solid var(--ink);background:var(--y)}
.cal button.done{background:#E8F3E9}
.cal button.past{opacity:.6}
.cal button.planned{background:#FAFAF8;border-style:dashed}
.cal .p{color:var(--red);font-weight:800}
footer{font-size:12.5px;color:var(--muted);text-align:center;padding:10px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--y);font-weight:800;padding:8px 18px;border-radius:30px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="bar">کتابخانهٔ نیما داینر · بستهٔ محتوای روزانه</div>
<header><div class="wrap">
  <h1>برنامهٔ امروز</h1>
  <div class="sub">ریلز، پست و استوری‌های هر روز؛ آماده برای انتشار</div>
  <nav class="dates">
    <button id="prev" aria-label="روز قبل">→</button>
    <div class="label" id="dlabel"></div>
    <button id="next" aria-label="روز بعد">←</button>
    <button id="today" class="today">امروز</button>
  </nav>
  <div class="checker"></div>
</div></header>
<main class="wrap" id="main"></main>
<footer id="foot"></footer>
<div class="toast" id="toast"></div>

رو می‌دونی.\n\nاون‌وقت قیمت‌گذاری منو دیگه حدسی نیست.\n\nپس یادت باشه: فودکاست دقیق، خطای آشپز صفر.\n\nسس مخصوص تو رسپی مکتوب داره؟\n\nمتن روی تصویر: ۲۰ لیتر سس | قیمت هر گرم | ۶۰ گرم در بشقاب\nکپشن:\nقانون ۳۲: رسپی‌های پایه یا زیررسپی‌ها.\n\nکتاب «مرجع جامع مدیریت رستوران» موجوده؛ برای خرید در دایرکت پیام بده.\n\n#نیما_داینر #مدیریت_رستوران #رستوران_داری #۱۰۱_قانون_طلایی #فست_فود #کافه #منو\n\n■ ریلز ۳ (آزاد) · گفت‌وگو\nایده: اولین کار هر روز صبح\nمتن نریشن:\nاولین کاری که هر روز صبح توی رستوران انجام می‌دی چیه؟\n\nپیشنهاد من اینه: قبل از هر چیز، عددهای دیروز رو نگاه کن.\n\nفروش، تعداد فاکتور، میانگین فاکتور و ضایعات.\n\nپنج دقیقه بیشتر طول نمی‌کشه.\n\nولی همین پنج دقیقه بهت می‌گه دیروز کجا خوب بودی و کجا پول از دستت رفت.\n\nمدیری که هر روز عددهاش رو می‌بینه، مشکل رو قبل از اینکه بزرگ بشه پیدا می‌کنه.\n\nتو صبح‌ها اول چی رو چک می‌کنی؟\n\n■ پست کاروسل\nبودجه‌ای که واقعاً کافی است\nکپشن:\nبودجه‌ای که واقعاً کافی است\nروز افتتاح حسابت صفر است و یخچال خراب شد. حالا چه؟\n\nورق بزن و سیو کن.\n\nبرای خرید «مرجع جامع مدیریت رستوران» و پیش‌خرید «کوچک شروع کن» و «دوام بیاور»، در دایرکت پیام بده.\n\n#نیما_داینر #مدیریت_رستوران #رستوران_داری #۱۰۱_قانون_طلایی #فست_فود #کافه #منو\n\n■ پست تلگرام (با تصویر جلد پست)\n📌 درهٔ مرگ ۳ تا ۶ ماه اول\nقانون ۸ · از کتاب «مرجع جامع مدیریت رستوران»\n\nروز افتتاح حساب بانکیت صفره؟ با اولین خرابی، مجبور می‌شی کیفیت رو بیاری پایین.\n\n📍 نکته‌ها:\n۱. حتی رستوران‌های موفق هم ممکنه ۳ تا ۶ ماه به سربه‌سر نرسن.\n۲. حداقل ۳ ماه اجاره، حقوق و قبوض رو نقد کنار بذار.\n۳. این پول رو هرگز خرج دکور نکن.\n\n💡 خلاصه: پایین آوردن کیفیت مواد، آغاز سقوط رستورانه.\n\n🎬 ریلزهای امروز در اینستاگرام:\n▫️ قانون ۸: درهٔ مرگ ۳ تا ۶ ماه اول\n▫️ قانون ۳۲: زیررسپی\n\n📚 درباره کتاب «مرجع جامع مدیریت رستوران»: ۱۰۱ قانون در هفت فصل، از انتخاب ملک تا سود و زیان و منو، با چهار چک‌لیست آمادهٔ چاپ.\n✅ کتاب موجود است؛ برای خرید در دایرکت اینستاگرام یا همین‌جا پیام بدهید.\n\nاینستاگرام: instagram.com/nimasdiner\nتلگرام: t.me/nimasdiner\n\n#نیما_داینر #مدیریت_رستوران #رستوران_داری وی آیتم امضا و افزودنی‌ها که مقایسه‌پذیر نیستن.\n\nپس یادت باشه: و کوچیک کردن بی‌صدای پرس ممنوع؛ مشتری زود می‌فهمه.\n\nمتن روی تصویر: لنگر: دیرتر | امضا و افزودنی: زودتر\nکپشن:\nآیتم‌های لنگر را دیرتر گران کن؛ از «دوام بیاور».\n\nکتاب «دوام بیاور» در پیش‌فروشه؛ برای پیش‌خرید در دایرکت پیام بده.\n\n#نیما_داینر #دوام_بیاور #رستوران_داری #رکود #مدیریت_بحران #کافه #کسب_و_کار_کوچک\n\n■ ریلز ۳ (آزاد) · یک دقیقه با من\nایده: ۳۰ ثانیه از شروع یا پایان شیفت؛ یه کار کوچیک که هر روز تکرار می‌کنی.\nمتن نریشن:\nاولین کاری که هر روز صبح می‌کنم…\n\n[کار رو انجام بده و همزمان توضیح بده؛ کوتاه و ساده.]\n\nکارهای کوچیک و تکراری، رستوران رو سرپا نگه می‌دارن.\n\nفردا یه نکتهٔ دیگه از کتاب رو می‌گم؛ دنبال کن که از دستش ندی.\n\n■ پست کاروسل\nهزینه‌های بی‌صدا\nکپشن:\nهزینه‌های بی‌صدا\nمایع ظرف‌شویی و دستکش ارزونن؛ تا وقتی جمع ماهانه‌شون رو ببینی.\n\nورق بزن و سیو کن.\n\nبرای خرید «مرجع جامع مدیریت رستوران» و پیش‌خرید «کوچک شروع کن» و «دوام بیاور»، در دایرکت پیام بده.\n\n#نیما_داینر #مدیریت_رستوران #رستوران_داری #۱۰۱_قانون_طلایی #فست_فود #کافه #منو\n\n■ پست تلگرام (با تصویر جلد پست)\n📌 هزینه‌های بی‌صدا\nقانون ۲۷ · از کتاب «مرجع جامع مدیریت رستوران»\n\nمایع ظرف‌شویی و دستکش ارزونن؛ تا وقتی جمع ماهانه‌شون رو ببینی.\n\n📍 نکته‌ها:\n۱. شوینده، دستمال، دستکش، سلفون، فویل، کاغذ فیش، کیسه زباله.\n۲. پمپ دوزینگ برای مایع‌ها، برش‌دهندهٔ استاندارد سلفون و فویل.\n۳. دستکش و دستمال سهمیه‌ای به هر شیفت تحویل بده.\n\n💡 خلاصه: همین سه کار، این هزینه‌ها رو تا ۳۰ درصد کم می‌کنه.\n\n🎬 ریلزهای امروز در اینستاگرام:\n▫️ قانون ۲۷: هزینه‌های بی‌صدا\n▫️ دوام بیاور: آیتم لنگر\n\n📚 درباره کتاب «مرجع جامع مدیریت رستوران»: ۱۰۱ قانون در هفت فصل، از انتخاب ملک تا سود و زیان و منو، با چهار چک‌لیست آمادهٔ چاپ.\n✅ کتاب موجود است؛ برای خرید در دایرکت اینستاگرام یا همین‌جا پیام بدهید.\n\nاینستاگرام: instagram.com/nimasdiner\nتلگرام: t.me/nimasdiner\n\n#نیما_داینر #مدیریت_رستوران #رستوران_داری\n\n■ استوری‌ها\n  ۱. نکتهٔ امروز: استیکر Emoji Slider یا «سیو کن» اضافه کن؛ ریلز مرتبط را منشن کن.\n  ۲. نکتهٔ امروز: استیکر Emoji Sli ه دیر میاد.\n۲. برای هر ۱۰۰ تومن برنامه، ۲۰ تومن کنار بذار: کل پول تقسیم بر ۱٫۲.\n۳. ۱٫۲ میلیارد داری؟ یک میلیارد برای برنامه، ۲۰۰ میلیون ذخیرهٔ دست‌نخورده.\n\n💡 خلاصه: اشتباه رایج: خرج کردن ذخیره برای دکور، قبل از اینکه مشکلی پیش بیاد.\n\n🧠 سؤال امروز: کل پولت ۱٫۲ میلیارد است. ذخیرهٔ پیش‌بینی‌نشده چقدر؟\n   الف) ۲۰ میلیون\n   ب) ۲۰۰ میلیون\n   ج) ۶۰۰ میلیون\n👇 جواب: ۲۰۰ میلیون — ۱٬۲۰۰ ÷ ۱٫۲ = ۱٬۰۰۰ میلیون برای برنامه، ۲۰۰ میلیون ذخیرهٔ دست‌نخورده.\n\n🎬 ریلزهای امروز در اینستاگرام:\n▫️ قانون ۲۸: مالیات، پول امانی\n▫️ کوچک شروع کن: قاعدهٔ ۲۰ درصد\n\n📚 درباره کتاب «کوچک شروع کن»: راهنمای راه‌اندازی فست‌فود، کافه، کیوسک و آشپزخانهٔ دلیوری (کترینگ) با سرمایهٔ محدود؛ پانزده فصل و فرم‌های آمادهٔ چاپ.\n⏳ این کتاب در پیش‌فروش است؛ برای پیش‌خرید در دایرکت اینستاگرام یا همین‌جا پیام بدهید.\n\nاینستاگرام: instagram.com/nimasdiner\nتلگرام: t.me/nimasdiner\n\n#نیما_داینر #مدیریت_رستوران #رستوران_داری", "image": "img/d28-post-01.jpg"}, "text": "پنجشنبه ۱۲ آذر ۱۴۰۵ — روز ۲۸\n\n■ ریلز ۱ · «مرجع جامع مدیریت رستوران» · قانون ۲۸ (حدود ۲۱ ثانیه)\nمتن نریشن:\nمالیات بر ارزش افزوده پول تو نیست؛ امانته.\n\nاین پول رو از مشتری می‌گیری و آخر فصل به سازمان مالیاتی می‌دی.\n\nاگه قیمت‌هات مالیات‌دار و نهاییه، اول سهم مالیات رو از فروش کم کن.\n\nفودکاست و اجاره رو بر اساس فروش خالص بدون مالیات بسنج.\n\nپس یادت باشه: وگرنه آخر هر فصل شوک مالیاتی می‌خوری.\n\nمتن روی تصویر: فروش − مالیات = فروش خالص\nکپشن:\nقانون ۲۸: مالیات بر ارزش افزوده و کسورات قانونی در قیمت‌گذاری.\n\nکتاب «مرجع جامع مدیریت رستوران» موجوده؛ برای خرید در دایرکت پیام بده.\n\n#نیما_داینر #مدیریت_رستوران #رستوران_داری #۱۰۱_قانون_طلایی #فست_فود #کافه #منو\n\n■ ریلز ۲ · «کوچک شروع کن» · کوچک شروع کن (حدود ۲۳ ثانیه)\nمتن نریشن:\nتقریباً هیچ راه‌اندازی‌ای در بودجه تموم نمی‌شه.\n\nلوله‌کشی زیر کف خراب درمیاد، برق برای هود کم میاد، مجوز دو ماه دیر میاد.\n\nبرای هر ۱۰۰ تومن برنامه، ۲۰ تومن کنار بذار: کل پول تقسیم بر ۱٫۲.\n\n۱٫۲ میلیارد داری؟ یک میلیارد برای برنامه، ۲۰۰ میلیون ذخیرهٔ دست‌نخورده.\n\nاشتباه رایج: خرج کردن ذخیره برای دکور، ق function idxForDate(iso) {
  const days = DATA.days;
  if (iso < days[0].date) return {i: 0, note: "before"};
  if (iso > days[days.length - 1].date) return {i: days.length - 1, note: "after"};
  return {i: days.findIndex(d => d.date === iso), note: ""};
}
function currentIndex() {
  const h = location.hash.replace("#", "");
  const m = h.match(/^d(\d{4}-\d{2}-\d{2})$/);
  return idxForDate(m ? m[1] : tehranToday());
}

  const type = name.endsWith(".zip") ? "application/zip" : "image/jpeg";
  const file = new File([blob], name, {type});
  if (navigator.canShare && navigator.canShare({files: [file]}) && !name.endsWith(".zip")) {
    try { await navigator.share({files: [file]}); return; }
    catch (e) { if (e.name === "AbortError") throw {code: "declined"}; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
const canSave = () => !!dl || STANDALONE;

function wireDownloads() {
  document.querySelectorAll(".dl").forEach(b => {
    if (!canSave() || (b.dataset.zip && !window.JSZip)) { b.style.display = "none"; return; }
    b.style.display = "";
    if (STANDALONE && !b.dataset.zip && b.textContent === "دانلود") b.textContent = "ارسال / ذخیره";
    b.onclick = async () => {
      const old = b.textContent; b.textContent = "…";
      try {
        if (b.dataset.zip) {
          const d = DATA.days[currentIndex().i], z = new JSZip();
          const add = async (path, name) => z.file(name, await (await fetch(path)).blob());
          for (const [k, r] of d.reels.entries()) await add(r.cover, `1-reel${k + 1}-cover.jpg`);
          for (const [j, s] of d.stories.entries()) await add(s.img, `2-story-${j + 1}.jpg`);
          if (d.post) for (const [j, im] of d.post.images.entries()) await add(im, `3-post-${String(j + 1).padStart(2, "0")}.jpg`);
          z.file("texts.txt", d.text);
          await saveFile(await z.generateAsync({type: "blob"}), `nimasdiner-day-${d.n}-${d.date}.zip`);
        } else {
          const res = await fetch(b.dataset.path);
          await saveFile(await res.blob(), b.dataset.name);
        }
        b.textContent = "✓"; b.classList.add("ok");
      } catch (e) {
        b.textContent = old;
        if (e && e.code === "declined") return;
        toast("ذخیره نشد؛ روی تصویر نگه دار و ذخیره کن");
      }
    };
  });
}

function go(j) { location.hash = "d" + DATA.days[j].date; }
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
render();
if (STANDALONE && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
(async () => {
  if (STANDALONE) return;
  try { if (window.claude && window.claude.use) dl = await window.claude.use("downloads"); } catch (e) { dl = null; }
  wireDownloads();
})();
</script>
