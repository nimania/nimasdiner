name: Import Diner magazine 02 archival files to primary website
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-magazine-02.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-verified-files:
    if: github.repository == 'nimania/nimasdiner'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout primary public website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch archival PDF and cover and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/magazine
          curl -fL --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 180 \
            'https://solar-loop.space.fast/assets/diner-mag-02.pdf' -o assets/magazine/02.pdf
          curl -fL --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 180 \
            'https://solar-loop.space.fast/assets/mag2.png' -o assets/magazine/02-cover.png
          printf '%s  %s\n' \
            '025d5b5d6b32d5de157211b4e937f66e68df4db3e685f4bb976853c795170f3b' \
            'assets/magazine/02.pdf' \
            '2877d4c1199bd00fe4e4395fcf19832af0a22438d79cec51e732b57146a407de' \
            'assets/magazine/02-cover.png' | sha256sum -c -
          test "$(head -c 5 assets/magazine/02.pdf)" = '%PDF-'
          test "$(wc -c < assets/magazine/02.pdf)" -eq 5600477
          test "$(wc -c < assets/magazine/02-cover.png)" -eq 1919074
          echo "Both exact archival assets verified."
      - name: Commit once to primary repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nimasdiner-archive-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/magazine/02.pdf assets/magazine/02-cover.png
          if git diff --cached --quiet; then
            echo "Assets already committed; no change."
          else
            git commit -m "Archive verified Diner issue 02 PDF and cover locally"
            git push origin HEAD:main
          fi
