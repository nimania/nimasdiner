          sha256sum --check SHA256SUMS
          test "$(find photos -name '*.webp' | wc -l)" -eq 40
          test "$(head -c 5 ordinary-people-of-iran.pdf)" = '%PDF-'
      - name: Commit source assets to staging branch only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content/ordinary-people-source assets/photography/ordinary-people/photos
          cp "$RUNNER_TEMP/ordinary-people/"{index.html,photos.json,SHA256SUMS} content/ordinary-people-source/
          cp "$RUNNER_TEMP/ordinary-people/photos/"*.webp assets/photography/ordinary-people/photos/
          cp "$RUNNER_TEMP/ordinary-people/ordinary-people-of-iran.pdf" assets/photography/ordinary-people/
          git config user.name "nimania-archive-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ordinary-people-source assets/photography/ordinary-people
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import all 40 verified photo assets, source metadata and photo book"
          git push origin HEAD:feature/ordinary-people-photoblog-20261125
