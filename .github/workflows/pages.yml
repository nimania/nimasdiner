name: Deploy Nima's Diner to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: diner-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate existing workflows
        run: |
          node --check app.js
          node --check consulting/consulting.js
          node --check services/delivery/worker/index.js
          node backend/tests/flow.cjs
      - name: Build SEO content pages
        run: |
          node --check tools/build-site.mjs
          node --check site-v2.js
          node tools/build-site.mjs
          node tools/test-site.mjs
          node tools/test-manager.mjs
      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nimasdiner-preview
          path: site-dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: node tools/build-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
