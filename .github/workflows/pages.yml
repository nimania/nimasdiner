name: Deploy Nima's Diner to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate book download code
        run: |
          node --check app.js
          node --check consulting/consulting.js
          node --check services/delivery/worker/index.js
          node backend/tests/flow.cjs
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html download.html privacy.html style.css app.js .nojekyll _site/
          cp -R assets _site/assets
          cp -R consulting _site/consulting
          cp -R app _site/app
      - name: Build isolated version 2 preview
        run: |
          # The public root remains from main; the feature branch builds only into /preview.
          git fetch --no-tags --depth=1 origin feature/expandable-seo-library
          git worktree add --detach "$RUNNER_TEMP/nimasdiner-preview" FETCH_HEAD
          cd "$RUNNER_TEMP/nimasdiner-preview"
          node tools/build-site.mjs
          node tools/test-site.mjs
          python3 - <<'PY'
          from pathlib import Path
          root=Path("site-dist")
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in {".html",".js",".css",".json",".xml",".txt"}:
                  continue
              content=p.read_text(encoding="utf-8")
              content=content.replace("/nimasdiner/","/nimasdiner/preview/")
              if p.suffix.lower()==".html":
                  content=content.replace("<head>","<head><meta name=\"robots\" content=\"noindex,nofollow\">",1)
              p.write_text(content,encoding="utf-8")
          assert '/nimasdiner/preview/library/' in (root/'index.html').read_text(encoding='utf-8')
          assert 'noindex,nofollow' in (root/'index.html').read_text(encoding='utf-8')
          PY
          mkdir -p "$GITHUB_WORKSPACE/_site/preview"
          cp -a site-dist/. "$GITHUB_WORKSPACE/_site/preview/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
