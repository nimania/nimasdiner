name: Deploy Nima's Diner to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild at 06:00 Tehran so scheduled glossary entries (publishOn) go live.
  schedule:
    - cron: '30 2 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: diner-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate existing workflows
        run: |
          node --check app.js
          node --check consulting/consulting.js
          node --check services/delivery/worker/index.js
          node backend/tests/flow.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Persian PDF renderer
        run: python -m pip install --disable-pip-version-check "weasyprint==66.0"
      - name: Build SEO content pages and book PDFs
        run: |
          node --check tools/build-site.mjs
          node --check tools/world-books.mjs
          node --check site-v2.js
          node tools/build-site.mjs
          python tools/build-world-book-pdfs.py
          node tools/test-site.mjs
          node tools/test-manager.mjs
      - name: Protect existing public page URLs
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "A previous commit is required for URL stability verification."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          BASE_DIR="$RUNNER_TEMP/nimasdiner-url-baseline"
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          (cd "$BASE_DIR" && node tools/build-site.mjs)
          node tools/check-url-stability.mjs "$BASE_DIR/site-dist" "$PWD/site-dist"
      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nimasdiner-preview
          path: site-dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore cached restaurant cover photos
        uses: actions/cache@v4
        with:
          path: .cache/review-covers
          key: diner-review-covers-20261117-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Persian PDF renderer
        run: python -m pip install --disable-pip-version-check "weasyprint==66.0"
      - name: Build site, PDF book analyses and review cover photos
        run: |
          node --check tools/mirror-review-covers.mjs
          node tools/build-site.mjs
          python tools/build-world-book-pdfs.py
          node tools/mirror-review-covers.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - name: Allow Pages artifact metadata to become available
        run: sleep 20
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
